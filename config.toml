# config.toml
title = "Jelly Manager"
version = "1.0"


[Media]
LogFile = 'A:\Media\Source\Video-Raw\CorruptedMedia.txt'
# Directory to move files to while processing
Staging = 'A:\Media\Staging'
Libraries = [
    {name = "Anime", path = 'D:\Media\Libraries\Anime'},
    {name = "Movies", path = 'D:\Media\Libraries\Movies'},
    {name = "Series", path = 'D:\Media\Libraries\Series'},
]

# Array of encoding directories
[[Media.Encoding]]
# Base path to attach to the pairs
Base = 'A:\Media\Source'
    [[Media.Encoding.DirPair]]
    # Appended to create the source and target directories
    Source = 'Video-Raw'
    Target = 'Video-AV1'
    [[Media.Encoding.DirPair]]
    Source = 'Music-Raw'
    Target = 'Music-MP3'

[[Media.Encoding]]
Base = 'D:\Media'
    [[Media.Encoding.DirPair]]
    Source = 'Libraries\RAudible'
    Target = 'Libraries\EAudible'
    

[DirectoryManager]
MovieFile_Exts = [".mkv", ".mp4", ".webm", ".avi", ".mov"]
AudioFile_Exts = [".mp3", ".flac", ".aac", ".alac", ".wav", ".m4b"]
# Keep this along side the video files if named the same
Match_Exts = [
    ".srt", 
    ".sub", 
    ".vtt", 
    ".ass", 
    ".ssa", 
    ".ttml", 
]
CleanEpisodeList = [
    [" [1080p]", ""],
    [" - ", " "],
    ["_", "'"]
]
# Jellyfin server looks for these forlders for specific items
# Ignore these folders for sorting files
IgnoreDirs = ["behind the scenes","deleted scenes","interviews","scenes","samples","shorts","featurettes","clips","other","extras","trailers","theme-music","backdrops"]

[CRDL]
# For use with https://github.com/Arutsuyo/wrapped-crunchyroll-downloader.git
CRDL_Path = 'A:\Media\Source\CRDL-Scrap\'
CRDL_Target = 'A:\Media\Source\Video-Raw\'
CRDL_exe = 'crunchyroll-downloader.exe'
# Required to be in the same directory as the exe and wvd file
CRDL_token = 'cr-etp-rt.txt'
# Download throttle in seconds to rate limit (min 1)
CRDL_Throttle = 900
# url list and target audio streams
# Streams are Exclusive downloads, so if the audio track
# is missing, that file WILL be skipped.
CRDL_CurrentList = [
    ['Current-jp\jp-urls.txt', "ja-JP"],
    ['Current-en\en-urls.txt', "ja-JP,en-US"],
]
CRDL_FinishedList = [
    ['Finshed\en-urls_u.txt', "ja-JP,en-US"],
    ['Finshed\jp-urls_u.txt', "ja-JP"]
]
# Logging level: 0=Errors, 1=Warnings, 2=Info, 3=Debug, 4=Trace
CRDL_LogLevel = 3


[LanguageMap]
und = "Undetermined"
jpn = "日本語"
eng = "English"
ind = "Bahasa Indonesia"
msa = "Bahasa Melayu"
cat = "Català"
deu = "Deutsch"
spa = "Español"
fra = "Français"
ita = "Italiano"
pol = "Polski"
por = "Português"
vie = "Tiếng Việt"
tur = "Türkçe"
rus = "Русский"
ara = "العربية"
hin = "हिंदी"
tam = "தமிழ்"
tel = "తెలుగు"
zho = "中文"
kor = "한국어"
tha = "ไทย"
